services:
  matplan:
    build: .
    image: matplan:latest
    container_name: matplan
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data/food.json:/app/food.json
    networks:
      - matplan-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: matplan-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - matplan
    networks:
      - matplan-net

networks:
  matplan-net:
